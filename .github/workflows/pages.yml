name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate authoritative source and state behavior
        run: npm test
      - name: Install browser test tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Check offline and repository-subpath browser behavior
        run: npm run test:browser
      - name: Stage only public application files
        run: |
          mkdir _site
          cp index.html _site/index.html
          test "$(find _site -type f | wc -l)" -eq 1
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
