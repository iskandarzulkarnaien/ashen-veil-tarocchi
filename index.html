s are loosening—or secretly fears they cannot escape them."},"dusk":{"u":"A destructive attachment or belief that one has no choice must end.","r":"Denial, relapse, or continued identification with a broken chain must end."},"ask":"What do I claim to need so badly that it now controls me?"},{"num":16,"name":"The Tower","core":"collapse · revelation · upheaval · shattered certainty","u":"sudden truth · destruction · false foundations exposed · disruption","r":"delayed collapse · private crisis · resisted revelation · narrowly avoided disaster","light":{"u":"Something unstable is breaking or a painful truth is emerging.","r":"A collapse is being delayed, denied, or contained only temporarily."},"shadow":{"u":"A hidden weakness or revelation threatens the existing structure.","r":"Someone secretly knows the structure is failing and is desperately holding it together."},"dusk":{"u":"False stability or a structure built upon illusion must fall.","r":"Attempts to postpone an inevitable collapse must end."},"ask":"What still stands only because nobody has dared disturb it?"},{"num":17,"name":"The Star","core":"hope · renewal · faith · guidance","u":"healing · inspiration · openness · trust in what comes next","r":"despair · lost faith · false hope · inability to see a path","light":{"u":"Genuine reason for hope, recovery, or faith is present.","r":"Discouragement, false hope, or loss of faith is plainly visible."},"shadow":{"u":"Hope or healing exists somewhere nobody has recognized yet.","r":"Hidden despair—or secret dependence upon unrealistic hope—influences events."},"dusk":{"u":"Waiting for hope or guidance from elsewhere must end; it is time to act.","r":"Despair, cynicism, or attachment to impossible salvation must end."},"ask":"What remains worth believing in when everything else is stripped away?"},{"num":18,"name":"The Moon","core":"uncertainty · illusion · instinct · hidden truth","u":"ambiguity · fear · dreams · distorted perception · mystery","r":"emerging truth · severe confusion · denied intuition · illusion weakening","light":{"u":"The clearest truth is that the situation is not yet clear.","r":"Confusion is beginning to break—or obvious misunderstanding has become dangerous."},"shadow":{"u":"Something feared, misunderstood, imagined, or concealed shapes events.","r":"A hidden illusion is beginning to unravel, or someone is suppressing what they already suspect."},"dusk":{"u":"Dependence upon appearances, fear, or uncertainty must end.","r":"Denial, paranoia, or refusal to acknowledge emerging truth must end."},"ask":"What am I assuming because I cannot yet see the whole path?"},{"num":19,"name":"The Sun","core":"clarity · joy · vitality · revelation","u":"happiness · truth exposed · confidence · flourishing · openness","r":"obscured joy · partial truth · excessive optimism · doubt beneath warmth","light":{"u":"Something genuinely good, clear, or life-giving is present.","r":"Clarity is incomplete; visible happiness or confidence conceals complications."},"shadow":{"u":"Hidden goodness, affection, vitality, or truth exists where nobody is looking.","r":"Concealed doubt, diminished joy, or an obscured truth lies beneath appearances."},"dusk":{"u":"Dependence upon certainty, praise, or perpetual happiness must end.","r":"False positivity, denial of difficulty, or fear of acknowledging joy must end."},"ask":"What becomes undeniable once light finally reaches it?"},{"num":20,"name":"Judgement","core":"reckoning · awakening · calling · absolution","u":"answering a summons · confronting the past · renewal · accountability","r":"self-condemnation · avoiding judgement · refusing the call · inability to forgive","light":{"u":"A genuine reckoning, awakening, or summons has arrived.","r":"Someone visibly refuses a necessary reckoning or remains trapped in guilt."},"shadow":{"u":"An unseen calling, unresolved judgement, or need for absolution influences events.","r":"Hidden shame, denial, or refusal to forgive prevents resolution."},"dusk":{"u":"Judgement has served its purpose; the past must finally be released.","r":"Endless guilt, avoidance, self-condemnation, or delayed reckoning must end."},"ask":"What is still calling to be answered before anyone can move on?"},{"num":21,"name":"The World","core":"completion · wholeness · culmination · integration","u":"fulfillment · closure · achievement · belonging · completed cycle","r":"unfinished business · incomplete closure · exclusion · almost complete","light":{"u":"A cycle is genuinely reaching completion or everything is falling into place.","r":"Completion is visibly close, but something remains unresolved."},"shadow":{"u":"A hidden connection or missing piece would reveal the whole picture.","r":"Unacknowledged unfinished business prevents genuine closure."},"dusk":{"u":"The completed chapter must be left behind so another can begin.","r":"Refusal to finish, leave, or accept incomplete closure must end."},"ask":"What becomes possible once this story is finally complete?"}];
const POSITIONS=[{key:'light',name:'The Light',symbol:'☀',question:'What is revealed?'},{key:'shadow',name:'The Shadow',symbol:'◐',question:'What is hidden?'},{key:'dusk',name:'The Dusk',symbol:'●',question:'What must end?'}];
const ROMAN=['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
const $=x=>document.getElementById(x);
let state={mode:'reading',selected:13,refOrientation:'u',activeSlot:0,slots:[{card:null,o:'u'},{card:null,o:'u'},{card:null,o:'u'}],question:''};
let returnToReadingSlot=null;
let referenceFocus=null;
try{const saved=JSON.parse(localStorage.getItem('vesperTarocchi_v1')||'null');if(saved && saved.slots?.length===3){state={...state,...saved};}}catch(e){}
delete state.notes;
state.selected=Number.isInteger(state.selected)&&state.selected>=0&&state.selected<22?state.selected:13;
state.mode=state.mode==='reference'?'reference':'reading';
state.activeSlot=Math.max(0,Math.min(2,Number(state.activeSlot)||0));
state.slots=state.slots.map(s=>({card:Number.isInteger(s?.card)&&s.card>=0&&s.card<22?s.card:null,o:s?.o==='r'?'r':'u'}));
function persist(){try{localStorage.setItem('vesperTarocchi_v1',JSON.stringify(state))}catch(e){}}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function showToast(s){const el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),2100)}
function setMode(mode,keepContext=false){if(mode==='reading'||!keepContext){returnToReadingSlot=null;referenceFocus=null;}state.mode=mode;for(const [key,view,tab] of [['reference','referenceView','referenceTab'],['reading','readingView','readingTab']]){const active=key===mode;$(view).classList.toggle('active',active);$(tab).classList.toggle('active',active);$(tab).setAttribute('aria-selected',String(active));}renderIndex();if(mode==='reference')renderReference();else renderReading();persist()}
function matches(card,term){if(!term)return true;let raw=[card.name,ROMAN[card.num],card.num,card.core,card.u,card.r,card.ask,...POSITIONS.flatMap(p=>[card[p.key].u,card[p.key].r])].join(' ').toLowerCase();return raw.includes(term)}
function renderIndex(){const term=$('search').value.trim().toLowerCase();const filtered=CARDS.filter(c=>matches(c,term));$('index').innerHTML=filtered.map(c=>`<button type="button" class="arcana-link ${state.selected===c.num?'active':''}" data-card="${c.num}" aria-current="${state.selected===c.num?'true':'false'}" title="${escapeHtml(c.core)}"><span class="numeral">${ROMAN[c.num]}</span><span class="arcname">${escapeHtml(c.name)}</span></button>`).join('')||'<div style="color:var(--muted);padding:13px;font-size:12px">No matching Arcana.</div>';
$('index').querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>selectCard(Number(el.dataset.card))));}
function selectCard(i){state.selected=i;if(state.mode==='reading'){assign(state.activeSlot,i);}else{referenceFocus=null;renderReference();renderIndex();persist()}}
function renderReference(){const c=CARDS[state.selected];$('refNav').hidden=returnToReadingSlot===null;$('refTitle').innerHTML=`<span class="roman">${ROMAN[c.num]}</span> — ${escapeHtml(c.name)}`;$('refCore').textContent=c.core;$('refAsk').textContent=c.ask;
$('refU').classList.toggle('active',state.refOrientation==='u');$('refR').classList.toggle('active',state.refOrientation==='r');$('refU').setAttribute('aria-pressed',state.refOrientation==='u');$('refR').setAttribute('aria-pressed',state.refOrientation==='r');
$('traits').innerHTML=`<div class="trait ${state.refOrientation==='u'?'':'secondary'}"><div class="traitlabel">Upright <span class="pill">↑</span></div><p>${escapeHtml(c.u)}</p></div><div class="trait ${state.refOrientation==='r'?'':'secondary'}"><div class="traitlabel">Reversed <span class="pill">↓</span></div><p>${escapeHtml(c.r)}</p></div>`;
$('positions').innerHTML=POSITIONS.map(p=>`<div class="position ${p.key} ${referenceFocus===p.key?'focused':''}"><div class="position-heading"><span class="position-symbol">${p.symbol}</span>${p.name}</div><div class="position-sub">${p.question}</div><div class="position-meaning ${state.refOrientation==='u'?'':'secondary'}"><strong>↑ Upright</strong><p>${escapeHtml(c[p.key].u)}</p></div><div class="position-meaning ${state.refOrientation==='r'?'':'secondary'}"><strong>↓ Reversed</strong><p>${escapeHtml(c[p.key].r)}</p></div></div>`).join('');}
function setReferenceOrientation(o){state.refOrientation=o;renderReference();persist()}
function assign(index,card){if(card!==null){const elsewhere=state.slots.findIndex((s,i)=>i!==index&&s.card===card);if(elsewhere!==-1){const prev=state.slots[index].card;state.slots[elsewhere].card=prev;}}state.slots[index].card=card;state.activeSlot=index;state.selected=card===null?state.selected:card;renderReading();renderIndex();persist()}
function orientSlot(i,o){state.slots[i].o=o;state.activeSlot=i;renderReading();persist()}
function selectSlot(i){state.activeSlot=i;renderReading();persist()}
function renderReading(){
$('spread').innerHTML=POSITIONS.map((p,i)=>{const s=state.slots[i],c=s.card===null?null:CARDS[s.card];return `<article class="spread-slot ${p.key} ${state.activeSlot===i?'selected':''}" data-slot="${i}" aria-label="${p.name} slot"><div class="slot-head"><div class="slot-position"><span class="sym">${p.symbol}</span>${p.name}</div></div><div class="slot-question">${p.question}</div><label class="sr-only" for="pick${i}">Card for ${p.name}</label><select class="cardpicker" id="pick${i}"><option value="">Select an Arcana…</option>${CARDS.map(x=>`<option value="${x.num}" ${x.num===s.card?'selected':''}>${ROMAN[x.num]} — ${escapeHtml(x.name)}</option>`).join('')}</select><div class="slot-controls"><button type="button" class="orient-option ${s.o==='u'?'active':''}" data-o="u" aria-pressed="${s.o==='u'}">↑ Upright</button><button type="button" class="orient-option ${s.o==='r'?'active':''}" data-o="r" aria-pressed="${s.o==='r'}">↓ Reversed</button></div><div class="result-box ${c?'':'empty'}"><span class="result-label">${c?'Interpretation':'Awaiting the card'}</span><p>${c?escapeHtml(c[p.key][s.o]):'Choose a card here—or select this position, then pick a card from the index on the left.'}</p></div>${c?'<div class="slot-contemplation"><span class="result-label">Question for contemplation</span><p>'+escapeHtml(c.ask)+'</p></div>':''}<div class="slot-footer"><span class="slot-core">${c?escapeHtml(c.core):'No Arcana selected'}</span>${c?'<button class="detail-link" type="button" data-detail="'+c.num+'">Full card ↗</button>':''}</div></article>`}).join('');
$('spread').querySelectorAll('.spread-slot').forEach(slotEl=>{const i=Number(slotEl.dataset.slot);slotEl.addEventListener('click',e=>{if(e.target.closest('button,select'))return;selectSlot(i)});slotEl.querySelector('select').addEventListener('focus',()=>{state.activeSlot=i;highlightSlots()});slotEl.querySelector('select').addEventListener('change',e=>assign(i,e.target.value===''?null:Number(e.target.value)));slotEl.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',()=>orientSlot(i,b.dataset.o)));const detail=slotEl.querySelector('[data-detail]');if(detail)detail.addEventListener('click',()=>{state.selected=Number(detail.dataset.detail);state.refOrientation=state.slots[i].o;returnToReadingSlot=i;referenceFocus=POSITIONS[i].key;setMode('reference',true)})});
$('summary').innerHTML=POSITIONS.map((p,i)=>{const s=state.slots[i],c=s.card===null?null:CARDS[s.card];return `<section class="summary-entry ${p.key}"><div class="summary-top"><span class="summary-pos">${p.symbol} ${p.name}</span><span class="summary-arcana">${c?ROMAN[c.num]+' — '+escapeHtml(c.name)+' '+(s.o==='r'?'↓':'↑'):'—'}</span></div><p class="summary-description">${c?escapeHtml(c[p.key][s.o]):'No Arcana selected.'}</p></section>`}).join('');}
function highlightSlots(){$('spread').querySelectorAll('[data-slot]').forEach(el=>el.classList.toggle('selected',Number(el.dataset.slot)===state.activeSlot));persist()}
function drawThree(){let indices=CARDS.map(c=>c.num);for(let i=indices.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]]}state.slots=indices.slice(0,3).map(c=>({card:c,o:Math.random()<.5?'u':'r'}));state.activeSlot=0;renderReading();renderIndex();persist();showToast('Three Arcana drawn')}
function clearReading(){state.slots=[{card:null,o:'u'},{card:null,o:'u'},{card:null,o:'u'}];state.question='';state.activeSlot=0;$('question').value='';resizeQuestion();renderReading();renderIndex();persist();showToast('Reading cleared')}
$('backToReading').addEventListener('click',()=>{if(returnToReadingSlot!==null)state.activeSlot=returnToReadingSlot;setMode('reading')});$('search').addEventListener('input',renderIndex);$('referenceTab').addEventListener('click',()=>setMode('reference'));$('readingTab').addEventListener('click',()=>setMode('reading'));$('refU').addEventListener('click',()=>setReferenceOrientation('u'));$('refR').addEventListener('click',()=>setReferenceOrientation('r'));$('drawBtn').addEventListener('click',drawThree);$('clearBtn').addEventListener('click',clearReading);
function resizeQuestion(){const el=$('question');const expanded=Boolean(el.value.trim())||document.activeElement===el;el.closest('.question-card').classList.toggle('expanded',expanded);el.style.height='34px';if(expanded){const desired=Math.max(67,el.scrollHeight);el.style.height=Math.min(100,desired)+'px';el.style.overflowY=desired>100?'auto':'hidden'}else{el.style.overflowY='hidden'}}
$('question').value=state.question;resizeQuestion();$('question').addEventListener('focus',resizeQuestion);$('question').addEventListener('blur',resizeQuestion);$('question').addEventListener('input',e=>{state.question=e.target.value;resizeQuestion();persist()});
document.addEventListener('keydown',e=>{const editable=e.target.matches('input,textarea,select,[contenteditable="true"]');if(e.key==='Escape'&&editable){e.target.blur();return}if(editable||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='/'){e.preventDefault();$('search').focus();return}const key=e.key.toLowerCase();if(key==='j'||key==='k'){e.preventDefault();state.selected=(state.selected+(key==='j'?1:21))%22;selectCard(state.selected);return}if(key==='u'||key==='r'){if(state.mode==='reference')setReferenceOrientation(key);else orientSlot(state.activeSlot,key);return}if(state.mode==='reading'&&['1','2','3'].includes(key)){selectSlot(Number(key)-1)}});
setMode(state.mode);
</script>
